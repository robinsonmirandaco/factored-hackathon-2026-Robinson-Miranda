# Answers of the simulated client (TRZ-43, design 13.2). Deterministic: no LLM writes them. The
# client gives each clue with the form and value the noise model drew for the case (amount
# exact, rounded or "about"; relative or exact date; merchant complete, partial, misspelled or by
# category), so a follow-up turn carries the same information the first message would have.
# Written apart from generators A and B. Placeholders: {amount}, {merchant}, {category}, {day},
# {month}, {weekday}, {clues}. Bump `version` on any change.
version: 1
variants:
  es-MX:
    number: {thousands: ",", decimal: "."}
    currency: {USD: dólares, MXN: pesos, COP: pesos colombianos, ARS: pesos argentinos}
    thousands_word: null
    weekdays: [lunes, martes, miércoles, jueves, viernes, sábado, domingo]
    months: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    amount: {exact: "fueron {amount}", rounded: "fueron {amount}", about: "fueron como {amount}", more_than: "fueron más de {amount}"}
    date: {exact: "el {day} de {month}", today: hoy, yesterday: ayer, day_before_yesterday: antier, this_week: esta semana, last_week: la semana pasada, two_weeks_ago: hace como dos semanas, last_month: el mes pasado, early_this_month: a principios de mes, last_weekday: "el {weekday} pasado"}
    merchant: "en {merchant}"
    category: "en {category}"
    categories: {Food: un supermercado, Services: un pago de servicios, Entertainment: entretenimiento, Health: una farmacia, Transport: transporte, Other: una tienda}
    channel: {POS: con terminal, ATM: en un cajero, Web: por internet, App: desde la app, Branch: en sucursal, Transfer: por transferencia}
    product: {credit_card: con la tarjeta de crédito, debit_card: con la tarjeta de débito, savings_account: de la cuenta de ahorro, checking_account: de la cuenta de cheques}
    card: {"true": "La tarjeta la tengo yo.", "false": "Ya no tengo la tarjeta."}
