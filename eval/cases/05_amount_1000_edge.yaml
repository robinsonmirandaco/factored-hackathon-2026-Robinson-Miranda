# 1000 USD is still in the approval band.
description: 'Unrecognized charge of 1000 USD: analyst_approval'
tags:
- golden
- unrecognized_charge
- amount_band
fixtures:
  customer:
    customer_id: EVC05
    document_type: Pasaporte
    document_number: EVC05-DOC
    first_name: Eval
    country: México
    country_code: MX
    timezone: America/Mexico_City
    segment: Basic
  products:
  - product_id: P05
    product_type: credit_card
    currency: USD
    product_status: Active
  transactions:
  - transaction_id: EVTX05
    transaction_type: Purchase
    amount: 1000.0
    currency: USD
    merchant_name: Liverpool
    merchant_category: Other
    transaction_country: MX
    channel: Web
    transaction_status: Approved
    hours_ago: 20
turns:
- message: No reconozco el cargo de 1000 dólares en Liverpool
  expect:
    intent: unrecognized_charge
    outcome: recognizing
    autonomy_level: L0
    actions_taken: []
    policy_action: null
- message: Sigo sin reconocerlo
  recognition: not_recognized
  expect:
    intent: unrecognized_charge
    outcome: pending_analyst_approval
    autonomy_level: L3
    actions_taken: []
    policy_action: analyst_approval
    policy_rule: approval.amount_above_auto_register
