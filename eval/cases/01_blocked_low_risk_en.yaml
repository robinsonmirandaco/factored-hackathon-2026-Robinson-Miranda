description: Blocked purchase, customer says it was them, low risk and small amount -> agent unblocks alone (L1)
tags: [golden, blocked_purchase]
# Risk (random scorer): 0.6*hash(EVTX003)=0.6*0.051 + domestic 0 + 0.15*(42/800)/3 = 0.033 -> low band.
# Policy: ceiling(blocked_purchase)=1, low band, 42 <= l1_max 500 -> clearance 1, no confirmation -> L1.
fixtures:
  customer: {id: EVC01, country: US, avg_monthly_spend: 800, tenure_months: 36}
  transactions:
    - {id: EVTX003, amount: 42.0, merchant: Amazon, merchant_category: electronics, country: US, channel: online, status: blocked, hours_ago: 2}
turns:
  - message: "My purchase of $42 at Amazon was declined but it was me, please unblock it"
    expect:
      intent: blocked_purchase
      outcome: auto_resolved
      autonomy_level: L1
      actions_taken: [unblock_transaction]
