# Just above 500 USD: an analyst approves before registering.
description: 'Unrecognized charge of 500.01 USD: analyst_approval'
tags:
- golden
- unrecognized_charge
- amount_band
fixtures:
  customer:
    customer_id: EVC04
    document_type: Pasaporte
    document_number: EVC04-DOC
    first_name: Eval
    country: México
    country_code: MX
    timezone: America/Mexico_City
    segment: Basic
  products:
  - product_id: P04
    product_type: credit_card
    currency: USD
    product_status: Active
  transactions:
  - transaction_id: EVTX04
    transaction_type: Purchase
    amount: 500.01
    currency: USD
    merchant_name: Liverpool
    merchant_category: Other
    transaction_country: MX
    channel: Web
    transaction_status: Approved
    hours_ago: 20
turns:
- message: No reconozco el cargo de 500.01 dólares en Liverpool
