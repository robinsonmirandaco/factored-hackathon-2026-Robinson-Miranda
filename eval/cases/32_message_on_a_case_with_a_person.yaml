  customer:
    customer_id: EVC32
    document_type: Pasaporte
    document_number: EVC32-DOC
    first_name: Eval
    country: México
    country_code: MX
    timezone: America/Mexico_City
    segment: Basic
  products:
  - product_id: P32
    product_type: credit_card
    currency: MXN
