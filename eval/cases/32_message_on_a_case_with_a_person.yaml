  - transaction_id: EVTX32B
    transaction_type: Purchase
    amount: 450.0
    currency: MXN
    merchant_name: MercaYa
    merchant_category: Food
    transaction_country: MX
    channel: POS
    transaction_status: Approved
    hours_ago: 120
  - transaction_id: EVTX32C
    transaction_type: Purchase
    amount: 1200.0
    currency: MXN
    merchant_name: MercaYa
    merchant_category: Food
    transaction_country: MX
