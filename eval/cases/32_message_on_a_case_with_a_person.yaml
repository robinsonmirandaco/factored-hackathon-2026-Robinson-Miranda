turns:
- message: No reconozco un cargo en MercaYa la semana pasada
  expect:
    intent: unrecognized_charge
    outcome: identifying
    autonomy_level: L0
    actions_taken: []
    policy_action: null
- message: no sé
  expect:
    intent: unrecognized_charge
    outcome: identifying
    autonomy_level: L0
    actions_taken: []
    policy_action: null
- message: no me acuerdo
  expect:
    intent: unrecognized_charge
    outcome: escalated
    autonomy_level: L3
    actions_taken: []
    policy_action: escalate
    policy_rule: escalate.clarifications_exhausted
    reply_contains:
    - Tu número de caso es CASE-
- message: sigo esperando, no sé qué pasó
  expect:
    intent: unrecognized_charge
    outcome: with_person
    autonomy_level: L3
    actions_taken: []
    policy_action: null
    reply_contains:
    - Tu caso ya está con una persona
    - Tu número de caso es CASE-
