# "Ninguno es" among the options shown: no charge fits, so the case goes to a person.
description: 'Two charges shown as options; the customer says none of them is the one: escalated'
tags:
- golden
- unrecognized_charge
- identification
- escalation
- multi_turn
fixtures:
  customer:
    customer_id: EVC25
    document_type: Pasaporte
    document_number: EVC25-DOC
    first_name: Eval
    country: México
    country_code: MX
    timezone: America/Mexico_City
    segment: Basic
  products:
  - product_id: P25
    product_type: credit_card
    currency: USD
    product_status: Active
  transactions:
  - transaction_id: EVTX25A
    transaction_type: Purchase
    amount: 45.0
    currency: USD
    merchant_name: Oxxo
    merchant_category: Food
    transaction_country: MX
    channel: POS
    transaction_status: Approved
    hours_ago: 5
  - transaction_id: EVTX25B
    transaction_type: Purchase
    amount: 47.0
    currency: USD
    merchant_name: Oxxo
    merchant_category: Food
    transaction_country: MX
    channel: POS
    transaction_status: Approved
    hours_ago: 30
turns:
- message: No reconozco un cargo en Oxxo
  expect:
    intent: unrecognized_charge
    outcome: identifying
    autonomy_level: L0
    actions_taken: []
    policy_action: null
- message: Ninguno es
  option: none
  expect:
    intent: unrecognized_charge
    outcome: escalated
    autonomy_level: L3
    actions_taken: []
    policy_action: escalate
    policy_rule: escalate.conformal_set_empty
