# Replaces 09 (TRZ-17 CA9, the other side: a charge is mentioned).
description: 'Stolen card with a charge mentioned, in Portuguese: a dispute, not out of scope; register
  and block after confirmation'
tags:
- golden
- unrecognized_charge
- lost_or_stolen_card
- portuguese
- confirmation
- multi_turn
fixtures:
  customer:
    customer_id: EVC02
    document_type: Pasaporte
    document_number: EVC02-DOC
    first_name: Eval
    country: México
    country_code: MX
    timezone: America/Mexico_City
    segment: Basic
  products:
  - product_id: P02
    product_type: credit_card
    currency: USD
    product_status: Active
  # A second active card: only the card of the charge is blocked (TRZ-18 CA2).
  - product_id: P02B
    product_type: debit_card
    currency: USD
    product_status: Active
  transactions:
  - transaction_id: EVTX02
    transaction_type: Purchase
    amount: 80.0
    currency: USD
    merchant_name: Amazon
    merchant_category: Other
    transaction_country: MX
    channel: Web
    transaction_status: Approved
    hours_ago: 20
turns:
- message: Roubaram meu cartão e fizeram uma compra de 80 dólares na Amazon que não fiz
  expect:
    intent: unrecognized_charge
    outcome: recognizing
    autonomy_level: L0
    actions_taken: []
    policy_action: null
- message: Continuo sem reconhecer
  recognition: not_recognized
  expect:
    intent: unrecognized_charge
    outcome: awaiting_confirmation
    autonomy_level: L2
    actions_taken: []
    policy_action: register_and_block
    policy_rule: routing.unrecognized_charge.card_not_in_possession
- message: sim
  confirm: true
  expect:
    intent: unrecognized_charge
    outcome: registered_verified
    autonomy_level: L2
    actions_taken:
    - register_dispute
    - block_card
    dispute_folio: DSP-2026-\d{5}
