# Credentials come only from .env (copy .env.example). Compose stops with a clear message if
# one is missing instead of starting with a default password.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # DB_PORT lets a second project (docker compose -p verify) run next to the default one.
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations as the owner, then loads the synthetic fixture only into an
  # empty database, so a cohort loaded with make seed is never mixed with it or overwritten.
  migrate:
    build: .
    image: bankagent:local
    env_file:
      - path: .env
        required: false
    environment:
      # Override the localhost URLs in .env: inside compose the database host is "db".
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql+psycopg://trazo_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      # May be empty for `compose config`; the seed stops with a clear message if it is.
      DOCUMENT_HASH_KEY: ${DOCUMENT_HASH_KEY?set DOCUMENT_HASH_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
    command: >
      sh -c "python -m app.cli.migrate &&
             python -m app.cli.seed synthetic --seed 42 --if-empty"
    restart: "no"

  api:
    build: .
    image: bankagent:local
    env_file:
      - path: .env
        required: false
    environment:
      # The API connects only as trazo_app, and never holds the owner's credentials.
      DATABASE_URL: postgresql+psycopg://trazo_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      ADMIN_DATABASE_URL: ""
      # Login hashes the typed document with it to find the customer (TRZ-09).
      DOCUMENT_HASH_KEY: ${DOCUMENT_HASH_KEY?set DOCUMENT_HASH_KEY in .env}
    # API_PORT, like DB_PORT, lets a second project run next to the default one.
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      # python:slim has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
