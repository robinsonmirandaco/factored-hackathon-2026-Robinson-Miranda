services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bankagent
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: bankagent:local
    # Optional so a fresh clone starts without a .env (LLM falls back to rules).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bank:bank@postgres:5432/bankagent
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    command: >
      sh -c "python -m app.cli.ingest synthetic --seed 42 &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    healthcheck:
      # python:slim has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
