[project]
name = "bankagent"
version = "0.1.0"
description = "AI-first banking customer service agent with graded autonomy, risk scoring and human-in-the-loop"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "duckdb>=1.5.5",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
]
# S3 extraction only (make extract). Not installed in the Docker image.
pipeline = [
    "boto3>=1.35",
]
# README figures only (make figures). Not installed in the Docker image.
figures = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["integration: needs the docker compose stack; runs in CI and before delivery"]
