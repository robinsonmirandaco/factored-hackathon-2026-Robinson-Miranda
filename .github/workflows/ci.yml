name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python comes from .python-version; dependencies come only from uv.lock.
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: LLM_ENABLED=false uv run --frozen pytest --cov=app --cov-report=xml
      - run: LLM_ENABLED=false uv run --frozen python -m app.cli.ingest synthetic --seed 42 --db sqlite:///ci.db
      # Each golden case seeds its own throwaway DB, so no DATABASE_URL here.
      - run: LLM_ENABLED=false uv run --frozen python -m app.cli.eval eval/cases --out eval/reports
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No .env in CI: the example file supplies the variables compose requires.
      - run: docker compose --env-file .env.example config -q
      - run: docker build -t bankagent:ci .
