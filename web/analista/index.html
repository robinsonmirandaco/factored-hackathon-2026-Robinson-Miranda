<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAZO · Consola de la analista</title>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/analyst.css">
  <script type="module" src="/assets/analyst.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="brand" href="#/cola"><span class="logo">T</span>TRAZO</a>
      <nav class="navpills" id="nav" hidden>
        <a href="#/cola" data-view="queue">Cola de casos</a>
      </nav>
      <span class="spacer"></span>
      <span class="sim">DEMO</span>
      <span class="avatar" id="who" hidden>Analista</span>
      <button type="button" class="btn small" id="logout" hidden>Salir</button>
    </div>
  </header>

  <main class="page">
    <section id="view-login" hidden>
      <div class="card narrow">
        <div class="row">
          <span class="brand"><span class="logo">T</span>TRAZO</span>
        </div>
        <h1 class="login-title">Ingresa a la consola</h1>
        <nav class="segmented" aria-label="Tipo de acceso">
          <a href="/">Cliente</a>
          <a href="#/entrar" aria-current="page">Analista</a>
        </nav>
        <form id="login-form" class="stack login-form" novalidate>
          <div>
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" required>
          </div>
          <div>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="notice small"><span><span class="sim">[simulado]</span> Credenciales de demostración: están en el README.</span></p>
          <p class="error" id="login-error" hidden></p>
          <button class="btn primary block" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section id="view-queue" hidden></section>
    <section id="view-case" hidden></section>
  </main>

  <footer>La IA propone · las reglas deciden · el humano corrige</footer>
</body>
</html>
