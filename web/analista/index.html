<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LATAM Bank · TRAZO · Consola de la analista</title>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/analyst.css">
  <script type="module" src="/assets/analyst.js"></script>
</head>
<body>
  <header class="appbar" id="appbar" hidden>
    <div class="appbar-inner">
      <a class="brand" href="#/cola">
        <span class="logo">L</span>
        <span class="brand-name"><strong>LATAM Bank</strong><span>Disputas · Consola de la analista</span></span>
        <span class="app-tag">TRAZO</span>
      </a>
      <nav class="navpills" id="nav">
        <a href="#/cola" data-view="queue">Cola de casos</a>
      </nav>
      <div class="appbar-end">
        <span class="sim">DEMO</span>
        <span class="avatar" id="who" title="Analista">A</span>
        <button type="button" class="btn small" id="logout">Salir</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="view-login" class="login-wrap" hidden>
      <div class="card narrow">
        <div class="row">
          <span class="logo">L</span>
          <strong class="login-brand">LATAM Bank</strong>
          <span class="app-tag">TRAZO</span>
        </div>
        <h1 class="login-title">Ingresa a tu banca</h1>
        <nav class="segmented" aria-label="Tipo de acceso">
          <a href="/">Cliente</a>
          <a href="#/entrar" aria-current="page">Analista</a>
        </nav>
        <span class="sim">Credenciales de prueba</span>
        <form id="login-form" class="stack" novalidate>
          <div>
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" required>
          </div>
          <div>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="error" id="login-error" hidden></p>
          <button class="btn primary block" type="submit">Ingresar</button>
        </form>
      </div>
    </section>

    <section id="view-queue" hidden></section>
    <section id="view-case" hidden></section>
  </main>

  <footer>TRAZO · La IA propone · las reglas deciden · el humano corrige</footer>
</body>
</html>
