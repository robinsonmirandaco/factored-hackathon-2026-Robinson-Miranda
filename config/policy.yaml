# Autonomy policy. Deterministic. The LLM never reads or overrides this file.
#
# Action classes:
#   0 read          lookup, profile
#   1 reversible    unblock, freeze, open case
#   2 sensitive     provisional credit, reverse charge   (needs customer confirmation)
#   3 irreversible  refund, close account                (human only, always)
#
# Display levels: L0 inform, L1 act, L2 act with confirmation, L3 human.
#
# Thresholds are placeholders until the cost function is fitted on the challenge data (Sep 28).
# Every change to this file is a versioned business decision. Keep the git history clean.

version: 1

risk_bands:
  low: 0.30      # score < low  -> low risk
  high: 0.70     # score >= high -> high risk (hard escalation)

amount_limits_usd:
  l1_max: 500      # above this, any action needs customer confirmation
  l2_max: 2000     # above this, everything goes to a human

# Intent -> highest action class the agent may run for it, before risk/amount adjustments.
intent_ceiling:
  blocked_purchase: 1
  unrecognized_charge: 2
  duplicate_charge: 2
  lost_or_stolen_card: 1
  general_inquiry: 0
  unknown: 0

# Action -> class.
action_class:
  lookup_transaction: 0
  get_customer_profile: 0
  list_recent_transactions: 0
  escalate_to_human: 0
  unblock_transaction: 1
  freeze_card: 1
  open_dispute: 1
  issue_provisional_credit: 2
  reverse_charge: 2
  issue_refund: 3
  close_account: 3

# Hard rules evaluated first. Any match forces escalation with clearance 0.
hard_escalation_rules:
  - name: high_risk
  - name: over_l2_amount
  - name: repeat_dispute_30d
  - name: restricted_customer
