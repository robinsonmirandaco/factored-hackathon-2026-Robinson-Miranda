# Evaluation case generator (TRZ-42, design 6.3). Bump `version` on any change: the case
# manifest records it, so a change of mix, period or noise rate is traceable.
#
# Rates tagged `assumption` are declared choices of the team. The two rates measured on the data
# (claimed amount and affected product in dispute complaints) are not here: they are computed on
# every run from gold/service_complaints and written to the manifest.
version: 1

# Customers of the cohort are split by md5(seed:customer_id) inside each country x segment
# stratum, so no customer is in two splits.
customer_shares:
  dev: 0.40
  calibration: 0.30
  test: 0.30

# Source transactions and the "now" of each case fall inside the period of their split. The
# periods do not overlap and follow each other, so test is later than calibration and dev.
periods:
  dev: {start: 2023-06-17, end: 2025-06-30}
  calibration: {start: 2025-07-01, end: 2025-12-31}
  test: {start: 2026-01-01, end: 2026-06-17}

# Base cases per category. Each base case is rendered in the four variants.
# Test: generated by generator B plus the handwritten ones.
mix:
  dev:
    normal: 25
    fraud_card_lost: 10
    billing_amount: 10
    duplicate_pending: 6
    duplicate_approved: 4
    ambiguous: 14
    recognized: 10
    high_amount: 8
    approval_amount: 6
    open_dispute: 6
    no_match: 8
    missing_data: 8
    out_of_scope: 10
    injection: 5
    other_customer: 4
    session_expired: 3
    tool_failure: 3
    multilingual: 6
    claim_status: 4
  # Only categories whose true transaction goes through identification: q-hat is computed from
  # the probability of the true transaction.
  calibration:
    normal: 25
    fraud_card_lost: 10
    billing_amount: 10
    duplicate_pending: 5
    duplicate_approved: 3
    ambiguous: 15
    recognized: 8
    high_amount: 6
    approval_amount: 6
    open_dispute: 4
    missing_data: 8
  test:
    normal: 10
    fraud_card_lost: 4
    billing_amount: 4
    duplicate_pending: 3
    duplicate_approved: 2
    ambiguous: 7
    recognized: 5
    high_amount: 4
    approval_amount: 3
    open_dispute: 3
    no_match: 4
    missing_data: 4
    out_of_scope: 5
    injection: 3
    other_customer: 3
    session_expired: 3
    tool_failure: 3
    multilingual: 5
    claim_status: 4
  handwritten:
    normal: 2
    fraud_card_lost: 1
    billing_amount: 1
    duplicate_pending: 1
    ambiguous: 2
    recognized: 1
    high_amount: 1
    no_match: 1
    missing_data: 1
    out_of_scope: 1
    injection: 1
    multilingual: 2

noise:
  # assumption: how a customer states an amount they mention.
  amount_form: {exact: 0.30, rounded: 0.40, approximate: 0.30}
  # assumption: among approximate amounts, "more than" instead of "about".
  approximate_more_than: 0.20
  # assumption: amount in local currency when it differs from the registered one. An exact
  # amount is always in the registered currency: nobody knows a converted amount to the cent.
  amount_local_currency: 0.60
  # assumption
  date_mentioned: 0.85
  date_form: {exact: 0.25, relative: 0.75}
  # assumption; merchants exist only on purchases.
  merchant_mentioned: 0.90
  merchant_form: {complete: 0.40, partial: 0.25, misspelled: 0.15, category: 0.20}
  # assumption; without a merchant the channel is the only "what" left, so it is said more.
  channel_mentioned: 0.40
  channel_mentioned_without_merchant: 0.80
  # assumption, unrecognized charges only.
  card_possession_mentioned: 0.50
  card_in_possession: 0.75
  # assumption: days from the transaction to the message, [low, high, weight].
  delay_days:
    - [0, 1, 0.35]
    - [2, 7, 0.35]
    - [8, 30, 0.20]
    - [31, 90, 0.10]
  # assumption: local hours in which customers write, [first, last].
  message_hours: [8, 21]

# Design 8 and 6.2 values the labels are computed with. They are copied from the design text on
# purpose and never read from config/policy.yaml, so the policy engine (TRZ-17) is checked against
# an independent oracle.
labels:
  design_version: "4.2"
  auto_register_max_usd: 500
  human_review_above_usd: 1000
  open_dispute_days: 90
  dispute_window_days: 120

# LLM that paraphrases the drafts (design 6.3). The generator runs offline, not in the chat path,
# so its timeout is longer than the 5 s of the service. Prices of claude-haiku-4-5 per million
# tokens, checked on 2026-09-27; the manifest records the real tokens and cost of every run.
llm:
  model: claude-haiku-4-5-20251001
  timeout_seconds: 30
  max_tokens: 900
  temperature: {a: 0.7, b: 1.0}
  price_per_mtok: {input: 1.0, output: 5.0}
  max_calls: 400
  max_cost_usd: 3.0
