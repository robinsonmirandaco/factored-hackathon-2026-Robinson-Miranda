# Bank holidays: days banks do not operate, per country, with the official source of each date.
# Saturdays and Sundays are never business days and are not listed, except holidays that fall
# on a weekend, which are kept so the table matches its sources.
#
# Mexico: the yearly CNBV rules published in the DOF.
# Colombia: no yearly official list exists; dates apply the move-to-Monday rule of Ley 51 de
#   1983 (and Ley 2578 de 2026) to each year's Easter date. Banco de la República defines a
#   bank day as excluding Saturdays, Sundays and holidays.
# Argentina: the yearly BCRA "C" communications listing the days financial entities do not
#   operate, plus Ley 27.399 for holidays that fall on a weekend and the bank workers'
#   agreement for Día del Bancario.
#
# Only closures set by a law, decree, regulator rule or binding agreement count. `unconfirmed`
# lists closures reported without such an instrument; they are not used when counting.
#
# Update this file when a new year's official list is published; dates outside `years` make
# the business-day count refuse to answer.

